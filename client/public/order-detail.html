<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EVERMERE SHUTTERS</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/orders.css">
  <link rel="stylesheet" href="/css/cart-drawer.css">
  <link rel="stylesheet" href="/css/user-menu.css">
</head>
<body data-page="order-detail">
  <div class="topbar">
    <img class="brand-logo" src="/images/logo.png" alt="Kenda">
    <div class="nav-links nav-pills">
      <a href="/user-dashboard.html"><span class="nav-icon">⌂</span>Dashboard</a>
      <a href="/configurator.html"><span class="nav-icon">⚙</span>Configurator</a>
      <a class="active" href="/order-history.html"><span class="nav-icon">🧾</span>Order History</a>
      <a href="/remakes.html"><span class="nav-icon">🛠</span>Remakes</a>
    </div>
    <div class="topbar-actions">
      <div class="unit-toggle" data-unit-toggle>
        <button type="button" data-unit="mm">mm</button>
        <button type="button" data-unit="inch">in</button>
      </div>
      <a class="cart-icon" href="/cart.html" style="visibility:hidden;pointer-events:none">🛒<span class="badge">0</span></a>
      <div class="user-menu" data-user-menu>
        <button class="user-avatar" type="button" data-user-avatar>👤</button>
        <div class="user-menu-panel">
          <button class="user-menu-item" type="button" data-user-action="password">Change Password</button>
          <button class="user-menu-item" type="button" data-user-action="logout">Logout</button>
        </div>
      </div>
    </div>
  </div>
  <div class="content" style="
    padding-left: 64px;
    padding-top: 32px;
    padding-right: 64px;
">
    <div class="page-header">
      <div>
        <a class="ghost" href="/order-history.html">← Back to Order List</a>
      </div>
      <div class="right-actions">
        <button class="ghost" type="button" data-order-print>Print</button>
        <button class="primary" data-order-send>Send</button>
      </div>
    </div>
    <div class="order-card">
      <h4 class="order-section-title">Order Information</h4>
      <div class="order-info" data-order-info></div>
    </div>
    <div class="order-card">
      <div class="detail-header">
        <strong>Shutter Details</strong>
      </div>
      <div class="details-list" data-order-lines></div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/cart-drawer.js"></script>
  <script src="/js/units.js"></script>
  <script src="/js/user-menu.js"></script>
  <script src="/js/orders-common.js"></script>
  <script src="/js/orders.js"></script>
  <script>document.addEventListener("DOMContentLoaded",()=>{if(window.cartDrawerInit)window.cartDrawerInit();if(window.userMenuInit)window.userMenuInit();if(window.ordersInit)window.ordersInit()})</script>
  <div class="order-edit-modal" data-order-edit-modal>
    <div class="order-edit-backdrop" data-order-edit-close></div>
    <div class="order-edit-panel">
      <iframe class="order-edit-frame" data-order-edit-frame></iframe>
    </div>
  </div>
</body>
</html>
