<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EVERMERE SHUTTERS</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-layout" data-page="admin-excel">
  <aside class="sidebar">
    <img class="brand-logo" src="/images/logo.png" alt="Kenda">
    <div class="small" data-i18n="admin.sidebar.system">ShutterPro System</div>
    <div style="height:12px"></div>
    <a class="nav-item" href="/admin-company.html" data-i18n="admin.sidebar.company">Company</a>
    <a class="nav-item" href="/admin-user.html" data-i18n="admin.sidebar.user_config">User Config</a>
    <a class="nav-item" href="/admin-profile.html" data-i18n="admin.sidebar.profile_config">Profile Config</a>
    <a class="nav-item" href="/admin-order-list.html" data-i18n="admin.sidebar.order_list">Order List</a>
    <a class="nav-item" href="/admin-remakes.html" data-i18n="admin.sidebar.remakes">Remakes</a>
    <a class="nav-item active" href="/admin-excel.html" data-i18n="admin.sidebar.excel_config">Excel Export Config</a>
    <a class="nav-item" href="/admin-config-prototype.html" data-i18n="admin.sidebar.config_prototype">Config Prototype</a>
    <div class="user-card">
      <div class="icon-btn">👤</div>
      <div>
        <div data-i18n="admin.sidebar.administrator">Administrator</div>
        <div>admin@system.com</div>
      </div>
    </div>
  </aside>
  <main class="content">
    <div class="page-header">
      <h2 data-i18n="admin.excel.title">Excel Export Config</h2>
      <div class="excel-actions">
        <button class="ghost" type="button" data-excel-export data-i18n="admin.excel.export_json">Export JSON</button>
        <button class="primary" type="button" data-excel-import data-i18n="admin.excel.import_json">Import JSON</button>
      </div>
    </div>
    <div class="table-card">
      <div class="stack">
        <div class="excel-meta">
          <div class="excel-file">
            <strong data-i18n="admin.excel.native_file">NativeFile:</strong>
            <label class="excel-upload">
              <input type="file" accept=".xlsx" data-excel-upload>
              <span class="link" data-excel-template data-i18n="admin.excel.no_template">No Template</span>
            </label>
            <span class="icon-btn" style="margin-left:6px" data-excel-template-clear>X</span>
          </div>
        </div>
        <div class="excel-sections" data-excel-sections></div>
      </div>
    </div>
  </main>
  <div class="excel-import-modal" data-excel-import-modal>
    <div class="excel-import-backdrop" data-excel-import-close></div>
    <div class="excel-import-panel">
      <div class="excel-import-header">
        <strong data-i18n="admin.excel.import_mapping">Import Mapping</strong>
        <button class="ghost" type="button" data-excel-import-close data-i18n="admin.common.close">Close</button>
      </div>
      <div class="excel-import-body">
        <div class="excel-import-block">
          <label class="excel-import-label" data-i18n="admin.excel.upload_json">Upload JSON</label>
          <label class="excel-import-upload">
            <input type="file" accept=".json,application/json" data-excel-import-file>
            <span class="link" data-i18n="admin.excel.choose_json">Choose JSON file</span>
          </label>
          <div class="excel-import-filename" data-excel-import-filename data-i18n="admin.excel.no_file_selected">No file selected</div>
        </div>
        <div class="excel-import-block">
          <label class="excel-import-label" data-i18n="admin.excel.preview">Preview</label>
          <pre class="excel-import-preview" data-excel-import-preview>{}</pre>
        </div>
      </div>
      <div class="excel-import-error" data-excel-import-error></div>
      <div class="excel-import-footer">
        <button class="primary" type="button" data-excel-import-apply data-i18n="admin.excel.apply_import">Apply Import</button>
      </div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/i18n/admin-i18n.js"></script>
  <script src="/js/admin.js"></script>
  <script>document.addEventListener("DOMContentLoaded",()=>{if(window.adminInit)window.adminInit()})</script>
</body>
</html>
